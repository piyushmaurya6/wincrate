name: CI — Build & Verify Standalone .exe

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-windows:
    name: Windows Stub Compile, E2E Repackage & Self-Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run WinCrate headless self-test
        run: python app.py --self-test

      - name: End-to-end synthetic package build & silent install test
        run: python tests/test_e2e_package.py
