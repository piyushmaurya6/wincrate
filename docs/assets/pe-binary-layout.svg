<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Generated Standalone Setup .exe Binary Layout">
  <rect x="0" y="0" width="1200" height="210" rx="12" fill="#ECEAE4"/>
  <rect x="12" y="12" width="1176" height="186" rx="9" fill="#F7F6F2" stroke="#D2CEC4" stroke-width="1.5"/>

  <text x="36" y="44" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#191917">Generated &lt;App&gt;_Setup.exe Binary Structure (WCRATE01 PE-Overlay Format)</text>
  <text x="1164" y="44" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#53514B">Offset 0x00000000 → EOF</text>

  <!-- Segmented Binary Strip -->
  <g transform="translate(36, 64)">
    <!-- Segment 1: PE + Icon -->
    <rect x="0" y="0" width="190" height="82" rx="6" fill="#FFFFFF" stroke="#7D7A71" stroke-width="1.5"/>
    <text x="14" y="26" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#B53E19">PE32+ HEADER &amp; ICON</text>
    <text x="14" y="48" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#191917">Multi-size Win32 .ico</text>
    <text x="14" y="67" font-family="Consolas, monospace" font-size="11" fill="#53514B">~16–48 KB</text>

    <!-- Segment 2: C# WinForms Stub -->
    <rect x="198" y="0" width="246" height="82" rx="6" fill="#FFFFFF" stroke="#7D7A71" stroke-width="1.5"/>
    <text x="212" y="26" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#B53E19">NATIVE SETUP STUB</text>
    <text x="212" y="48" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#191917">WinForms Wizard + --silent CLI</text>
    <text x="212" y="67" font-family="Consolas, monospace" font-size="11" fill="#53514B">Compiled via csc.exe (~28 KB)</text>

    <!-- Segment 3: 0-Based ZIP Payload -->
    <rect x="452" y="0" width="466" height="82" rx="6" fill="#F6E6DF" stroke="#B53E19" stroke-width="1.5"/>
    <text x="468" y="26" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#B53E19">0-BASED ZIP PAYLOAD STREAM (SubStream)</text>
    <text x="468" y="48" font-family="Consolas, monospace" font-size="12" fill="#191917">manifest.json · Uninstall.exe · app/* · appdata_*/* · registry.json</text>
    <text x="468" y="67" font-family="'Segoe UI', sans-serif" font-size="12" fill="#53514B">Streamed in 64 KB chunks — never loads whole archive into RAM</text>

    <!-- Segment 4: 16-Byte Footer -->
    <rect x="926" y="0" width="202" height="82" rx="6" fill="#191917" stroke="#191917" stroke-width="1.5"/>
    <text x="940" y="26" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#F6E6DF">16-BYTE FOOTER</text>
    <text x="940" y="48" font-family="Consolas, monospace" font-size="12" fill="#FFFFFF">[int64 payload_off]</text>
    <text x="940" y="67" font-family="Consolas, monospace" font-size="12" fill="#E3F1E8">ASCII "WCRATE01"</text>
  </g>

  <text x="36" y="176" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#53514B">Because the ZIP archive is written with 0-based Central Directory offsets and read through a bounded FileStream slice, packages scale cleanly past 4 GB.</text>
</svg>
